server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: smart-quiz-system

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_quiz}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 10s
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.king.smartquiz.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # 生产环境请通过环境变量覆盖，且长度需 >= 32 字节
  secret: ${JWT_SECRET:smart-quiz-system-jwt-secret-key-please-change-in-prod-2026}
  expire: 1800          # 令牌有效期（秒），30 分钟
  header: Authorization
  prefix: "Bearer "

# AI 大模型配置（OpenAI 兼容协议，默认对接通义千问）
# 切换豆包/DeepSeek 只需改 base-url 与 model：
#   豆包:   base-url=https://ark.cn-beijing.volces.com/api/v3   model=doubao-pro-32k
#   DeepSeek: base-url=https://api.deepseek.com                 model=deepseek-chat
ai:
  mock: ${AI_MOCK:true}                       # 无 API Key 时离线跑通全流程；接入真实模型改为 false
  api-key: ${AI_API_KEY:}                     # 通过环境变量注入，切勿硬编码
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  temperature: 0.8
  timeout: 60                                 # 单次调用超时（秒）
  max-retry: 3                                # JSON 解析失败重试次数

# 日志
logging:
  level:
    org.king.smartquiz: debug
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
